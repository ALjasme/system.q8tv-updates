name: monthly photos
# New Kuwait photos for the home screen on the 1st of each month (tools/monthly_photos.py).
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: pick and prepare this month's photos
        run: python tools/monthly_photos.py "$RUNNER_TEMP/photos" .
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date +%Y-%m)
          if ! ls "$RUNNER_TEMP"/photos/*.jpg >/dev/null 2>&1; then
            gh issue create --title "photos: queue is empty ($month)" --body "Add reviewed Wikimedia Commons photos to photos/queue.json." || true
            exit 0
          fi
          gh release create "photos-$month" "$RUNNER_TEMP"/photos/*.jpg --title "Photos $month" --notes "Kuwait photos from Wikimedia Commons; authors and licences in photos/photos.json"
          git config user.name "system.q8tv photos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/photos.json
          git commit -m "photos $month"
          git push
